name: Spec status

# Enforces the maturity-status system:
#   - every page listed in SUMMARY.md must declare a valid `status:` in its front matter, and
#   - versioning/feature-status.md (generated by tools/status-report.ts) must be up to date.
# The check runs the tool in its default (read-only) mode and fails if either condition is unmet.
# It needs only this repository and tsx — no reference parser — so it runs without `npm install`
# (the dev dependency `internet-object` is a local file: link that does not exist in CI).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check feature status (coverage + dashboard freshness)
        run: npx --yes tsx tools/status-report.ts
